<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relíquia Flutuante</title>
<style>
:root{box-sizing:border-box;--bg:#04050c}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif;color:#cfe8ff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ti{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-weight:800;letter-spacing:3px;font-size:13px;pointer-events:none;text-shadow:0 0 12px #2ad4ff}
#ti small{display:block;font-weight:500;letter-spacing:1px;font-size:11px;opacity:.7;margin-top:2px}
#tri{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:12px;opacity:.75;pointer-events:none;font-variant-numeric:tabular-nums}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-size:12px;opacity:.7;pointer-events:none;transition:opacity 1s}
</style>
</head>
<body>
<div id="ti">RELÍQUIA FLUTUANTE<small>modelo 3D procedural</small></div><div id="tri"></div><div id="hint">Arraste para girar · pinça ou scroll para zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),PI=Math.PI;
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.15;document.body.prepend(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x04050c);S.fog=new T.FogExp2(0x04050c,.011);
const C=new T.PerspectiveCamera(45,1,.1,300);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let sd=7;const rnd=()=>{sd=sd*16807%2147483647;return(sd-1)/2147483646};
const d=new T.Object3D(),V=(x,y,z)=>new T.Vector3(x,y,z);
const std=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,metalness:.6,roughness:.4},o));
const add=(geo,mat,x,y,z,p)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m};
const glowTex=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)};
const GT=glowTex();
const glow=(col,s,x,y,z,p)=>{const m=new T.Sprite(new T.SpriteMaterial({map:GT,color:col,blending:T.AdditiveBlending,depthWrite:false,transparent:true}));m.scale.set(s,s,1);m.position.set(x,y,z);p.add(m);return m};
/* luzes */
S.add(new T.HemisphereLight(0x7a88c0,0x120a1c,.55));
const sun=new T.DirectionalLight(0xffd9b0,1);sun.position.set(8,10,6);S.add(sun);
const W=new T.Group();S.add(W);
const lc=new T.PointLight(0x40e0ff,2.2,16);lc.position.set(0,5.2,0);W.add(lc);
const lm=new T.PointLight(0xd050ff,1.6,14);lm.position.set(0,-4.5,0);W.add(lm);
/* ilha flutuante */
const ig=new T.IcosahedronGeometry(2.2,12),ip=ig.attributes.position,vv=V(0,0,0),cols=new Float32Array(ip.count*3),cc=new T.Color();
for(let i=0;i<ip.count;i++){vv.fromBufferAttribute(ip,i).normalize();const h=vv.y,nz=Math.sin(vv.x*4.1+vv.y*2.3)*Math.cos(vv.z*3.7-vv.y*1.9)*.5+Math.sin(vv.x*9+vv.z*7)*.15+Math.sin(vv.x*21+vv.y*17+vv.z*13)*.04,r=2.2*(1+.2*nz);
if(h>0)ip.setXYZ(i,vv.x*r*1.15,h*r*.45,vv.z*r*1.15);else{const k=1+h*.55;ip.setXYZ(i,vv.x*r*k*1.15,h*r*1.9,vv.z*r*k*1.15)}
cc.set(h>.35?0x4a8f5a:h>0?0x6b5a4a:h>-.5?0x575062:0x30354d).offsetHSL(0,0,(nz+.3)*.08);cols.set([cc.r,cc.g,cc.b],i*3)}
ig.setAttribute('color',new T.BufferAttribute(cols,3));ig.computeVertexNormals();
W.add(new T.Mesh(ig,new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.95,metalness:0})));
/* cristais instanciados na superfície da ilha */
function crystals(n,col,em,ok){const im=new T.InstancedMesh(new T.ConeGeometry(.1,.75,6),std(0xffffff,{emissive:em,emissiveIntensity:.9,metalness:.2,roughness:.15,flatShading:true}),n),q=new T.Quaternion(),up=V(0,1,0),p=V(0,0,0),nn=V(0,0,0);let k=0,g=0;
while(k<n&&g++<20000){const i=Math.floor(rnd()*ip.count);p.fromBufferAttribute(ip,i);nn.fromBufferAttribute(ig.attributes.normal,i);if(!ok(p,nn))continue;q.setFromUnitVectors(up,nn);const s=.6+rnd()*1.4;d.position.copy(p).addScaledVector(nn,.2*s);d.quaternion.copy(q);d.scale.set(s,s*(.8+rnd()),s);d.updateMatrix();im.setMatrixAt(k,d.matrix);im.setColorAt(k,new T.Color(col).offsetHSL(rnd()*.08-.04,0,rnd()*.2-.1));k++}
im.count=k;W.add(im)}
crystals(70,0x40e0ff,0x0a5a7a,(p,n)=>p.y>-.5&&n.y>.1&&Math.hypot(p.x,p.z)>1.2);
crystals(50,0xd050ff,0x4a0a6a,(p,n)=>n.y<.4&&p.y<.8);
/* torre */
const metal=std(0xaab4c8,{metalness:.9,roughness:.3}),gold=std(0xd9a441,{metalness:.95,roughness:.28});
add(new T.CylinderGeometry(.8,.95,.5,32),metal,0,1.25,0,W);add(new T.CylinderGeometry(.5,.62,1.4,32),metal,0,2.2,0,W);add(new T.ConeGeometry(.42,1.3,32),gold,0,3.55,0,W);
for(const [y,r] of[[1.0,.98],[1.5,.7],[2.9,.55]]){const f=add(new T.TorusGeometry(r,.06,10,48),gold,0,y,0,W);f.rotation.x=PI/2}
const win=new T.InstancedMesh(new T.BoxGeometry(.08,.22,.05),new T.MeshBasicMaterial({color:0xffd27a}),24);
for(let r=0;r<3;r++)for(let i=0;i<8;i++){const a=i/8*PI*2+r*.2,rad=r?.52:.9;d.position.set(Math.cos(a)*rad,r?1.9+r*.35:1.25,Math.sin(a)*rad);d.rotation.set(0,-a+PI/2,0);d.scale.set(1,1,1);d.updateMatrix();win.setMatrixAt(r*8+i,d.matrix)}
W.add(win);
const beam=add(new T.CylinderGeometry(.04,.16,1.2,16,1,true),new T.MeshBasicMaterial({color:0x40e0ff,transparent:true,opacity:.5,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}),0,4.7,0,W);
/* núcleo */
const core=add(new T.IcosahedronGeometry(.45,2),std(0xffffff,{emissive:0x28d8ff,emissiveIntensity:1.8,metalness:0,roughness:.2,flatShading:true}),0,5.2,0,W);
const cage=add(new T.IcosahedronGeometry(.8,1),new T.MeshBasicMaterial({color:0x7af0ff,wireframe:true,transparent:true,opacity:.6}),0,5.2,0,W);
glow(0x40e0ff,6,0,5.2,0,W);glow(0xd050ff,5,0,-3.8,0,W);
/* anéis armilares */
const rings=[];
[[1.5,.05,.5,0,.6,0x40e0ff],[2,.04,-.6,.3,-.45,0xd050ff],[2.5,.06,.2,-.8,.35,0xffc060],[3,.035,.9,.2,-.25,0x60ff9a],[3.5,.045,-.3,.5,.2,0xff6080]].forEach(([Rr,tb,tx,tz,sp,col])=>{
const tilt=new T.Group();tilt.position.y=5.2;tilt.rotation.set(tx,0,tz);W.add(tilt);const spin=new T.Group();tilt.add(spin);
const tor=add(new T.TorusGeometry(Rr,tb,12,128),std(col,{metalness:.9,roughness:.25,emissive:col,emissiveIntensity:.3}),0,0,0,spin);tor.rotation.x=PI/2;
const n=Math.round(Rr*22),ticks=new T.InstancedMesh(new T.BoxGeometry(.05,.17,.05),std(0xdde6ff),n),runes=new T.InstancedMesh(new T.OctahedronGeometry(.09),std(col,{emissive:col,emissiveIntensity:1.2}),8);
for(let i=0;i<n;i++){const a=i/n*PI*2;d.position.set(Math.cos(a)*Rr,0,Math.sin(a)*Rr);d.rotation.set(0,-a,0);d.scale.set(1,i%5?1:1.8,1);d.updateMatrix();ticks.setMatrixAt(i,d.matrix)}
for(let i=0;i<8;i++){const a=(i+.5)/8*PI*2;d.position.set(Math.cos(a)*Rr,.2,Math.sin(a)*Rr);d.rotation.set(0,a,0);d.scale.set(1,1,1);d.updateMatrix();runes.setMatrixAt(i,d.matrix)}
spin.add(ticks,runes);
const sat=add(new T.SphereGeometry(.14,16,12),std(col,{emissive:col,emissiveIntensity:2}),Rr,0,0,spin);glow(col,1.2,Rr,0,0,spin);
rings.push({spin,sp});});
/* engrenagens */
function gear(r,n,th,col){const out=new T.Group(),g=new T.Group(),m=std(col,{metalness:.85,roughness:.35});out.add(g);
const disc=add(new T.CylinderGeometry(r,r,th,n*2),m,0,0,0,g);disc.rotation.x=PI/2;const hub=add(new T.CylinderGeometry(r*.25,r*.25,th*1.7,16),gold,0,0,0,g);hub.rotation.x=PI/2;
const teeth=new T.InstancedMesh(new T.BoxGeometry(r*.26,r*.2,th),m,n),sp=new T.InstancedMesh(new T.BoxGeometry(r*.8,r*.1,th*.4),gold,6);
for(let i=0;i<n;i++){const a=i/n*PI*2;d.position.set(Math.cos(a)*r*1.08,Math.sin(a)*r*1.08,0);d.rotation.set(0,0,a);d.scale.set(1,1,1);d.updateMatrix();teeth.setMatrixAt(i,d.matrix)}
for(let i=0;i<6;i++){d.position.set(0,0,th*.45);d.rotation.set(0,0,i/6*PI);d.updateMatrix();sp.setMatrixAt(i,d.matrix)}
const ring=add(new T.TorusGeometry(r*.62,r*.04,8,40),gold,0,0,th*.5,g);g.add(teeth,sp);return{out,g}}
const gears=[];[[0,1.9,2.0,1,16,0x8a93a8,.5],[2.1,1.9,2.5,.85,14,0x9a7a4a,-.6],[4.2,1.9,1.8,1.05,18,0x6f7f9a,.4]].forEach(([th,rad,y,r,n,col,sp])=>{const o=gear(r,n,.18,col);o.out.position.set(Math.cos(th)*rad,y,Math.sin(th)*rad);o.out.rotation.y=-th;W.add(o.out);gears.push({g:o.g,sp})});
/* detritos orbitais */
const ND=90,deb=new T.InstancedMesh(new T.DodecahedronGeometry(.18,0),std(0x5a5f70,{metalness:.2,roughness:.9,flatShading:true}),ND),dp=[];
for(let i=0;i<ND;i++)dp.push({r:3.6+rnd()*3.2,a:rnd()*PI*2,w:(.1+rnd()*.25)*(rnd()<.5?-1:1),y:-1+rnd()*9,ph:rnd()*6,s:.4+rnd()*1.6,rx:rnd()*2,ry:rnd()*2});
W.add(deb);
/* tentáculos de energia */
const tend=[];for(let i=0;i<8;i++){const a=i/8*PI*2,pts=[V(0,5.2,0)];for(let k=1;k<=4;k++){const f=k/4,rr=f*2.4;pts.push(V(Math.cos(a+f*1.2)*rr,5.2-f*4+Math.sin(f*6+i)*.3,Math.sin(a+f*1.2)*rr))}
const mt=new T.MeshBasicMaterial({color:i%2?0xd050ff:0x40e0ff,transparent:true,opacity:.4,blending:T.AdditiveBlending,depthWrite:false});W.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),48,.018,6,false),mt));tend.push(mt)}
/* partículas e estrelas */
const NP=1500,pa=new Float32Array(NP*3),pv=[];for(let i=0;i<NP;i++){const a=rnd()*PI*2,r=1+rnd()*9;pa.set([Math.cos(a)*r,-6+rnd()*17,Math.sin(a)*r],i*3);pv.push(.2+rnd()*.6)}
const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pa,3));
W.add(new T.Points(pg,new T.PointsMaterial({map:GT,size:.16,color:0x9fe8ff,transparent:true,blending:T.AdditiveBlending,depthWrite:false,opacity:.8})));
const sa=new Float32Array(900*3);for(let i=0;i<900;i++){const a=rnd()*PI*2,b=Math.acos(rnd()*2-1),r=70+rnd()*30;sa.set([r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)],i*3)}
const sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(sa,3));S.add(new T.Points(sg,new T.PointsMaterial({size:.5,color:0xffffff,sizeAttenuation:false,fog:false})));
/* controles */
let th=.7,ph=1.3,dist=15,idle=0,t=0,fc=0;const pt=new Map(),cv=R.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);idle=0;$('hint').style.opacity=0});
cv.addEventListener('pointermove',e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId);
if(pt.size==1){th-=(e.clientX-o[0])*.008;ph=clamp(ph-(e.clientY-o[1])*.008,.25,2.9)}
else if(pt.size==2){const o2=[...pt.entries()].find(([k])=>k!=e.pointerId)[1],d0=Math.hypot(o[0]-o2[0],o[1]-o2[1]),d1=Math.hypot(e.clientX-o2[0],e.clientY-o2[1]);if(d1>1)dist=clamp(dist*d0/d1,6,40)}
pt.set(e.pointerId,[e.clientX,e.clientY]);idle=0});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>pt.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{dist=clamp(dist*(1+e.deltaY*.001),6,40);idle=0;e.preventDefault()},{passive:false});
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();setTimeout(()=>$('hint').style.opacity=0,7000);
const clk=new T.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clk.getDelta(),.05);t+=dt;idle+=dt;
W.position.y=Math.sin(t*.8)*.35;W.rotation.y=Math.sin(t*.2)*.15;W.rotation.z=Math.sin(t*.5)*.025;
const pl=1+Math.sin(t*3)*.08;core.scale.setScalar(pl);core.rotation.y+=dt;cage.rotation.y-=dt*.4;cage.rotation.x+=dt*.3;lc.intensity=2.2+Math.sin(t*3)*.6;beam.material.opacity=.4+Math.sin(t*5)*.12;
for(const r of rings)r.spin.rotation.y+=dt*r.sp;for(const g of gears)g.g.rotation.z+=dt*g.sp;
tend.forEach((m,i)=>m.opacity=.25+.2*Math.sin(t*2+i));
for(let i=0;i<ND;i++){const o=dp[i];o.a+=o.w*dt;d.position.set(Math.cos(o.a)*o.r,o.y+Math.sin(t*.5+o.ph)*.3,Math.sin(o.a)*o.r);d.rotation.set(o.rx*t,o.ry*t,0);d.scale.setScalar(o.s);d.updateMatrix();deb.setMatrixAt(i,d.matrix)}
deb.instanceMatrix.needsUpdate=true;
const cs=Math.cos(dt*.15),sn=Math.sin(dt*.15);for(let i=0;i<NP;i++){const x=pa[i*3],z=pa[i*3+2];pa[i*3]=x*cs-z*sn;pa[i*3+2]=x*sn+z*cs;pa[i*3+1]+=pv[i]*dt;if(pa[i*3+1]>11)pa[i*3+1]=-6}pg.attributes.position.needsUpdate=true;
if(idle>3)th+=dt*.14;
const dd=dist*Math.max(1,.9/C.aspect);C.position.set(dd*Math.sin(ph)*Math.sin(th),2+dd*Math.cos(ph),dd*Math.sin(ph)*Math.cos(th));C.lookAt(0,2,0);
R.render(S,C);if(fc++%20==0)$('tri').textContent='▲ '+Math.round(R.info.render.triangles/1000)+'k triângulos'}
frame();
</script>
</body>
</html>
