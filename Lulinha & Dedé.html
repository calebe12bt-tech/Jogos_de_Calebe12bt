<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Lulinha &amp; Dedé</title>
<style>
:root{box-sizing:border-box;--bg:#0e1116}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;gap:8px;justify-content:flex-end;pointer-events:none}

.b{position:fixed;left:0;top:0;max-width:min(260px,70vw);padding:8px 12px;background:#fff;color:#111;border-radius:14px;border:3px solid;font-size:14px;line-height:1.3;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.b b{display:block;font-size:11px;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase}
.b::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:inherit;border-bottom:0}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#end{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;display:none}
#end div{font-size:30px;font-weight:800;text-shadow:0 2px 8px #000;margin-bottom:10px}
.b span{font-weight:700;overflow-wrap:anywhere}
#cap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;text-align:center;font-weight:800;font-size:17px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .5s;pointer-events:none;padding:0 14px}
#ono{position:fixed;left:50%;top:30%;font-size:60px;font-weight:900;color:#ffe14d;-webkit-text-stroke:3px #c0392b;text-shadow:0 6px 0 #7a1f12;opacity:0;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%) rotate(-8deg)}
#ono.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-25deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(-8deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(-8deg)}}
#fim{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:64px;font-weight:900;color:#fff;-webkit-text-stroke:3px #000;opacity:0;pointer-events:none}
#fim.on{opacity:1;animation:wob .35s infinite alternate}
@keyframes wob{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.08)}}
</style>
</head>
<body>

<script>

const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.prepend(R.domElement);

[[-8,-6],[-5,-8],[6,-7],[9,-5],[-11,-3],[12,-2],[0,-10],[-14,-9],[14,-9],[3,-12],[-3,-5],[-16,-4],[16,-5]].forEach(([x,z],i)=>{const g=new T.Group(),s=.8+i%3*.25;M(CY(.25,1.4),0x7a5230,0,.7,0,g);M(new T.ConeGeometry(1.1,2,8),0x2f8f46,0,2.2,0,g);M(new T.ConeGeometry(.8,1.6,8),0x37a553,0,3.2,0,g);g.scale.setScalar(s);g.position.set(x,0,z);S.add(g)});
const cl=[];for(let i=0;i<5;i++){const g=new T.Group();for(let j=0;j<3;j++){const m=M(SP(1.2-j*.15),new T.MeshLambertMaterial({color:0xffffff,fog:false}),j*1.2-1.2,j%2*.3,0,g);m.castShadow=false}g.position.set(-25+i*12,9+i%2*2,-18);S.add(g);cl.push(g)}

function burst(x,y,z){for(let i=0;i<NP;i++){sa.set([x,y,z],i*3);const a=Math.random()*6.28,e=Math.random()*3+1;sv.set([Math.cos(a)*e,Math.random()*4,Math.sin(a)*e],i*3)}spT=1.1;sg.attributes.position.needsUpdate=true}

function flash(){const f=$('fl');f.style.transition='none';f.style.opacity=1;setTimeout(()=>{f.style.transition='opacity .9s';f.style.opacity=0},40)}
/* som */
let AC=null,on=true,mg;
const sd=$('sd'),lab=()=>sd.textContent=!AC?'🔇 Ativar som':on?'🔊 Som':'🔇 Mudo';
function audioOn(){if(!AC){const X=window.AudioContext||window.webkitAudioContext;if(!X)return;AC=new X();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);lab()}if(AC.state=='suspended'&&!paused)AC.resume()}
const ok=()=>AC&&on&&AC.state=='running';
function tone(f0,f1,d,type='square',v=.15,at=0){if(!ok())return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+at;o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(mg);o.start(n);o.stop(n+d+.02)}

const slapS=()=>{noise(.12,.7,3500);tone(220,50,.18,'square',.35)},plofS=()=>{tone(150,35,.3,'sine',.6);noise(.18,.4,500)},
boing=k=>{for(let i=0;i<k;i++)tone(260,640,.13,'sine',.25,i*.15)},pips=d=>{for(let i=0;i<d/.07;i++)tone(1100+(i%4)*180,1100+(i%4)*180,.05,'square',.09,i*.07)},
dingS=()=>{tone(880,880,.18,'triangle',.18);tone(1320,1320,.3,'triangle',.18,.12)},bongS=()=>tone(200,140,.3,'square',.18),
boomS=()=>{noise(1.3,.8,900);tone(140,30,1.2,'sawtooth',.4)},whooshS=d=>{noise(d,.3,2500);tone(200,1800,d,'sawtooth',.1)};
function voice(c,s){const lu=c===LU,lg=/^[HK]/.test(s.txt),b=(lu?560:310)*(1+s.sc*.6)*(lg?1.25:1)*(.9+Math.random()*.3);
tone(b,b*(lg?.7:1+.15*s.sc),s.sc?.11:.07,s.sc?'sawtooth':lu?'triangle':'square',s.sc?.07:.1)}
/* direção */
const D=["OIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII","OIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII","COMO VOCÊ TÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁ","EU TÔ BEMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM","BEM????","BEMMMMMMMMMMMMMMMMM","AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","QUE FOI?????","NADA","ENTÃO POR QUE VOCÊ GRITOU????","EU NÃO SEI AAAAAAAAAAAAAAAAAAAAA","EI EI EI EI EI EI EI EI EI EI EI EI EI EI EI","PARA","NÃO","PARA","NÃO POSSO","POR QUÊ","LULINHA","O QUÊ","LULINHA POPEIRO PEPEIRO PIPIPIPIPIPIPIPIPIPIPIPIPIPIPIPI","AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","PÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁ 💥💥💥","QUEM DEU UM PÁ","EU","POR QUÊ","PÁ","ISSO NÃO EXPLICA NADA","PÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁÁ","PAREEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE","HÁ HÁ HÁ HÁ HÁ HÁ HÁ HÁ HÁ HÁ HÁ","VOCÊ TÁ RINDO DO QUÊ","PEPEIRO","NÃO","PEPEIROOOOOOOOOOOOOOOOOOOOOOOOO","NÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃÃO","PIRIRIRIRIRIRIRIRIRIRIRIRIRIRIRI","PIPIPIPIPIPIPIPIPIPIPIPIPIPIPIPIPIP","PLOFT","...","PLOFT","VOCÊ TÁ BEM?","NÃO SEI","EU TAMBÉM NÃO","AAAAAAA","AAAAAAAAA","AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO","EI EI EI EI EI EI EI EI EI EI EI EI EI","LULULULULULULULULULULULULULULULULULU","POPEIRO PEPEIRO POPEIRO PEPEIRO","PAAAAAAAPAPAPAPAPAPAPAPAPAPAPAPÁÁÁÁÁ 💥","MEU DEUS","MEU DEUS","MEU DEUS","MEU DEUS","KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKK","PARA DE RIR","NÃO CONSIGO","POR QUÊ","PEPEIRO","EU VOU EMBORA","TCHAU","TCHAU","...","EI","OI","ESQUECEU DO PEPEIRO","AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","PEPEIROOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO","PIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII","PÁ","PLOFT","FIM","NÃO É FIM","É SIM","NÃO","SIM","NÃO","SIM","AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"];
let t=0,li=0,paused=false,shk=0;const Q=[];
const later=(d,f)=>Q.push([t+d,f]),go=(c,x,z)=>{c.tx=x;c.tz=z},look=(c,o)=>{c.face=Math.atan2(o.g.position.x-c.g.position.x,o.g.position.z-c.g.position.z)};
const run=s=>Math.max(...(s.match(/(.)\1*/gu)||['']).map(x=>[...x].length));
const dur=s=>{const r=run(s);return s=='...'?1.3:r>=8?1.2+Math.min(1.4,r*.025):.8+Math.min(1.6,s.length*.05)};
const T0=[];let ac=3.2;D.forEach(s=>{T0.push(ac);ac+=dur(s)+.35});
const WD=new Set([1,2,3,4,22,26,28,38,39,40,51,61,62,63,65,66,67,68,69,70,71,72,80]);
const SH={wide:[[0,3.6,10.5],[0,1.2,0]]};
const onC=c=>{const x=c.g.position.x,z=c.g.position.z;return[[x*.55,1.9,z+4.6],[x,1.25,z]]};
const cp=new T.Vector3(),cl2=new T.Vector3(),cpT=new T.Vector3(),clT=new T.Vector3();
function shot(p,l){cpT.set(...p);clT.set(...l)}
function ono(x){const e=$('ono');e.textContent=x;e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
function ch(x){dingS();const e=$('cap');e.textContent=x;e.style.opacity=1;later(3,()=>e.style.opacity=0)}
function fim(x){if(x)bongS();const e=$('fim');e.textContent=x;e.className=x?'on':''}
function say(c,txt,d,wide){const r=run(txt),sc=r>=8?Math.min(1,r/25):0;c.say={txt,t0:t,t1:t+d,sc};c.talk=1;c.bub.style.display='block';c.bub.style.fontSize=(13+sc*5)+'px';if(sc)shk=Math.max(shk,.04+.22*sc);wide?shot(...SH.wide):shot(...onC(c))}
function slap(a,b){const dir=Math.sign(b.g.position.x-a.g.position.x)||1;a.sp=7;go(a,b.g.position.x-dir,b.g.position.z);look(a,b);
later(.3,()=>{a.slap=.35});
later(.48,()=>{burst((a.g.position.x+b.g.position.x)/2,1.2,0);slapS();whooshS(.4);ono(['PÁ!','PÁÁ!','PÁ!!'][Math.random()*3|0]);b.spin=.6;b.kx=dir*7;b.kz=0;shk=.3});
later(2.2,()=>{a.sp=2.6;go(a,a===LU?-1.8:1.8,0);go(b,b===LU?-1.8:1.8,0)})}
function start(i){const n=i+1,s=D[i],c=i%2?DE:LU,o=i%2?LU:DE,d=dur(s);say(c,s,d,WD.has(n));
switch(n){
case 1:go(LU,-1.8,0);go(DE,1.8,0);LU.sp=DE.sp=3.4;ch('Capítulo 1: O Cumprimento');later(3,()=>LU.sp=DE.sp=2.6);break;
case 7:LU.hop=.7;ch('Capítulo 2: O Grito Sem Motivo');break;
case 12:case 48:c.hop=1.4;boing(6);break;
case 20:ch('Capítulo 3: O Pepeiro');c.jit=d;pips(d);break;
case 22:ch('Capítulo 4: A Era do Pá');slap(c,o);break;
case 26:case 28:slap(c,o);break;
case 51:case 71:slap(c,o);break;
case 30:case 56:c.laugh=d+.5;break;
case 36:case 37:case 49:case 50:c.jit=d;pips(d);break;
case 38:ch('Capítulo 5: A Queda');DE.fall=1;plofS();ono('PLOFT!');break;
case 40:LU.fall=1;plofS();ono('PLOFT!');break;
case 44:LU.fall=DE.fall=0;LU.hop=DE.hop=.5;boing(2);break;
case 52:case 53:case 54:case 55:c.hop=.5;boing(2);break;
case 61:ch('Capítulo 6: O Adeus Mais Curto da História');LU.sp=2.4;go(LU,-12,2);break;
case 62:DE.wave=d+.6;break;
case 63:look(LU,DE);LU.wave=d+.6;break;
case 67:whooshS(1.2);LU.sp=8;go(LU,-1.8,0);break;
case 72:DE.fall=1;plofS();ono('PLOFT!');break;
case 73:ch('Capítulo 7: O Fim');fim('FIM');break;
case 74:DE.fall=0;DE.hop=.6;fim('NÃO É FIM');shk=.2;break;
case 75:case 77:case 79:fim('FIM');shk=.2;break;
case 76:case 78:fim('NÃO É FIM');shk=.2;break;
case 80:fim('');flash();boomS();whooshS(3);burst(0,1.5,0);ono('AAAAA!');shk=.6;LU.rk=DE.rk=1;later(1,()=>burst(0,6,0));later(4.5,()=>{$('end').style.display='block';shot(...SH.wide)});break}}
function init(){t=0;li=0;paused=false;shk=0;Q.length=0;$('pz').textContent='⏸ Pausar';
LU.g.position.set(-10,0,1);DE.g.position.set(10,0,-1);
for(const c of CH){c.tx=c.g.position.x;c.tz=c.g.position.z;c.g.rotation.set(0,c===LU?Math.PI/2:-Math.PI/2,0);c.face=c.g.rotation.y;Object.assign(c,{ph:0,talk:0,spin:0,hop:0,jit:0,laugh:0,wave:0,slap:0,fall:0,fl:0,rk:0,ry:0,kx:0,kz:0,sp:2.6,say:null});c.bub.style.display='none'}
spT=0;$('end').style.display='none';fim('');$('ono').className='';ch('LULINHA & DEDÉ · Uma tarde calma na Praça do Grito');shot(...SH.wide);cp.copy(cpT);cl2.copy(clT)}
function upd(c,dt){const g=c.g,p=c.p,dx=c.tx-g.position.x,dz=c.tz-g.position.z,d=Math.hypot(dx,dz),mv=d>.04&&!c.spin&&!c.fall&&!c.kx;
